# mise-managed toolchain for the Brane repo
# `mise install` fetches everything; `mise run`/hooked shims put them on PATH.

[settings]
experimental = true

[tools]
# Lean 4 + lake (lake ships inside the lean4 tool package).
# Must match projects/*/lean-toolchain files.
"github:leanprover/lean4" = "4.35.0"

# For the figure scripts (projects/*/learn-*/images/make_figs.py) and misc tooling.
python = "3.15.2"

# Threads for the Lean compiler; goes into the image itself, not the host env.
[oci.env]
LEAN_NUM_THREADS = "4"

# ------------------------------------------------------------------------------
# OCI container image (use on a Linux host — e.g. WSL; Windows binaries would
# otherwise be copied in and fail with "Exec format error" inside the image)
# ------------------------------------------------------------------------------
[oci]
from = "debian:bookworm-slim"                       # glibc base, matches lean4 binaries
tag = "ghcr.io/TreeHappy/brane:latest"              # what `mise oci push` pushes
workdir = "/workspace"
user = "1000:1000"                                  # non-root user inside the image

[oci.labels]
"org.opencontainers.image.source" = "https://github.com/TreeHappy/brane"
"org.opencontainers.image.title" = "brane-dev"
"org.opencontainers.image.description" = "Lean 4 + Python dev image for the Brane math exploration repo"

[tasks.image-build]
description = "Build the OCI dev image (mise-oci layout, one layer per tool)"
run = "mise oci build -o ./mise-oci"

[tasks.image-run]
description = "Run a command in the dev image (podman preferred, docker fallback); mount the repo"
run = "mise oci run --image-dir ./mise-oci -it --volume \"$PWD:/workspace\" --"

[tasks.image-push]
description = "Push the dev image to ghcr.io (needs `podman login ghcr.io` or docker login)"
run = "mise oci push --image-dir ./mise-oci"

[tasks.build]
description = "Build every Lean project in the repo"
run = '''
set -euo pipefail
for proj in projects/*/lakefile.toml; do
  dir=$(dirname "$proj")
  echo "== lake build: $dir"
  (cd "$dir" && lake build)
done
'''

[tasks.test]
description = "Check all Lean proofs in every project"
run = '''
set -euo pipefail
for proj in projects/*/lakefile.toml; do
  dir=$(dirname "$proj")
  for proof in "$dir"/learn-*/Proofs.lean; do
    [ -e "$proof" ] || continue
    echo "== lean check: $proof"
    (cd "$dir" && lake env lean "${proof#"$dir"/}")
  done
done
'''

[tasks.solve]
description = "Run the metropolis sampler executable (topic: metropolis)"
run = '''
set -euo pipefail
cd projects/metropolis && lake build && lake exe metropolis
'''

[tasks.figs]
description = "Regenerate tutorial figures (topic: metropolis)"
run = '''
set -euo pipefail
cd projects/metropolis/learn-metropolis/images
python3 make_figs.py
'''
